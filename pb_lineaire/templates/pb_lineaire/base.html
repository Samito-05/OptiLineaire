{% load static %}<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}OptiLinéaire{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Archivo:ital,wght@0,400;0,500;0,600;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link href="{% static 'pb_lineaire/global.css' %}" rel="stylesheet">
  <script>
    // Appliquer le thème avant le premier rendu pour éviter le flash
    (function () {
      var saved = localStorage.getItem('optilineaire-theme');
      var dark = saved ? saved === 'dark'
                       : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']]
      },
      options: {
        // Ne pas traiter le contenu à l'intérieur de ces balises
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>

<nav class="navbar navbar-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'pb_lineaire:index' %}">OptiLinéaire</a>
    <div class="d-flex align-items-center gap-3">
      <span class="navbar-text" id="navbarMethodText">{% block navbar_method %}{% endblock %}</span>
      <button type="button" class="btn btn-sm btn-outline-light theme-toggle" id="themeToggle" aria-pressed="false">
        Mode sombre
      </button>
    </div>
  </div>
</nav>

<div class="container pb-5">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
/* ── Thème clair / sombre ── */
(function () {
  const storageKey = 'optilineaire-theme';
  const root = document.documentElement;
  const toggle = document.getElementById('themeToggle');

  function systemPrefersDark() {
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  function applyTheme(theme) {
    root.setAttribute('data-theme', theme);
    if (toggle) {
      const isDark = theme === 'dark';
      toggle.textContent = isDark ? 'Mode clair' : 'Mode sombre';
      toggle.setAttribute('aria-pressed', String(isDark));
      toggle.classList.toggle('btn-outline-light', !isDark);
      toggle.classList.toggle('btn-light', isDark);
    }
  }

  const savedTheme = localStorage.getItem(storageKey);
  const initialTheme = savedTheme || (systemPrefersDark() ? 'dark' : 'light');
  applyTheme(initialTheme);

  if (toggle) {
    toggle.addEventListener('click', function () {
      const nextTheme = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      localStorage.setItem(storageKey, nextTheme);
      applyTheme(nextTheme);
    });
  }
})();
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
