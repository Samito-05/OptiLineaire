<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}OptiLinéaire{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fc;
      --surface: #ffffff;
      --surface-2: #eef2f7;
      --text: #16202c;
      --muted: #5b6777;
      --border: #d7dde6;
      --navbar-bg: #111827;
      --navbar-text: #f8fafc;
      --table-head-bg: #243447;
      --table-head-text: #ffffff;
      --color-lf: #e8f4fd;
      --color-entering: #cfe2ff;
      --color-leaving: #fff3cd;
      --color-pivot: #dc3545;
      --card-shadow: 0 0.5rem 1.5rem rgba(16, 24, 40, 0.08);
      --input-bg: #ffffff;
      --input-text: #16202c;
      --input-border: #cdd6e1;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0f172a;
      --surface: #111827;
      --surface-2: #1f2937;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --border: #334155;
      --navbar-bg: #050816;
      --navbar-text: #f8fafc;
      --table-head-bg: #0b1220;
      --table-head-text: #f8fafc;
      --color-lf: rgba(59, 130, 246, 0.16);
      --color-entering: rgba(96, 165, 250, 0.24);
      --color-leaving: rgba(245, 158, 11, 0.18);
      --color-pivot: #f43f5e;
      --card-shadow: 0 0.8rem 2rem rgba(0, 0, 0, 0.35);
      --input-bg: #0b1220;
      --input-text: #e5e7eb;
      --input-border: #334155;
    }
    body {
      background: var(--bg);
      color: var(--text);
    }
    .navbar-brand { font-weight: 700; letter-spacing: 1px; }
    .navbar { background: var(--navbar-bg) !important; }
    .navbar .navbar-text,
    .navbar .navbar-brand {
      color: var(--navbar-text) !important;
    }

    .card,
    .alert,
    .dropdown-menu,
    .list-group-item,
    .table,
    .form-control,
    .form-select {
      background-color: var(--surface);
      color: var(--text);
      border-color: var(--border);
    }
    .card,
    .alert,
    .dropdown-menu {
      box-shadow: var(--card-shadow);
    }
    .card-header {
      background: var(--surface-2);
      border-color: var(--border);
      color: var(--text);
    }
    .alert-light {
      background-color: var(--surface-2) !important;
      color: var(--text) !important;
      border-color: var(--border) !important;
    }
    .text-muted { color: var(--muted) !important; }
    .bg-light { background-color: var(--surface-2) !important; }
    .border { border-color: var(--border) !important; }
    .table { --bs-table-bg: var(--surface); --bs-table-color: var(--text); }
    .table > :not(caption) > * > * { background-color: var(--surface); color: var(--text); border-color: var(--border); }
    .table-dark { background: var(--table-head-bg) !important; color: var(--table-head-text) !important; }
    .simplex-table { font-size: .9rem; border-collapse: collapse; }
    .simplex-table th, .simplex-table td {
      border: 1px solid var(--border);
      padding: 6px 12px;
      text-align: center;
      vertical-align: middle;
    }
    .simplex-table th { background: var(--table-head-bg); color: var(--table-head-text); }
    .label-col { font-weight: 700; background: var(--table-head-bg) !important; color: var(--table-head-text); }
    .row-lf > td,
    .row-lf > th {
      background: var(--color-lf) !important;
      font-weight: 600;
    }
    .row-lf .label-col,
    .row-lf .ratio-col {
      background: var(--color-lf) !important;
      color: var(--text) !important;
    }
    .col-entering { background: var(--color-entering) !important; }
    .row-leaving  { background: var(--color-leaving) !important; }
    .cell-pivot   {
      background: var(--color-pivot) !important;
      color: #fff !important;
      font-weight: 700;
      border-radius: 3px;
    }
    .iteration-card { border-left: 4px solid #60a5fa; }
    .pivot-step-card {
      background: var(--surface);
    }
    .ratio-col { color: var(--muted); font-style: italic; min-width: 80px; }
    .legend-box { width: 20px; height: 20px; display: inline-block; border: 1px solid var(--border); vertical-align: middle; }
    .btn-outline-secondary {
      color: var(--text);
      border-color: var(--border);
    }
    .btn-outline-secondary:hover {
      background: var(--surface-2);
      color: var(--text);
      border-color: var(--border);
    }
    .form-control,
    .form-select {
      background-color: var(--input-bg);
      color: var(--input-text);
      border-color: var(--input-border);
    }
    .form-control:focus,
    .form-select:focus {
      background-color: var(--input-bg);
      color: var(--input-text);
      border-color: #60a5fa;
      box-shadow: 0 0 0 0.2rem rgba(96, 165, 250, 0.2);
    }
    .modal-content,
    .offcanvas,
    .popover {
      background: var(--surface);
      color: var(--text);
      border-color: var(--border);
    }
    .theme-toggle {
      white-space: nowrap;
    }
    .collapse-icon {
      display: inline-block;
      transition: transform .22s ease;
      transform-origin: 50% 50%;
      transform: rotate(0deg);
    }
    .btn:not(.collapsed) .collapse-icon {
      transform: rotate(180deg);
    }

    /* ── Toggle méthode (3 états) ── */
    .method-toggle {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
      padding: 6px 0;
    }
    .method-track {
      position: relative;
      width: 76px;
      height: 28px;
      border-radius: 14px;
      background: #6c757d;
      transition: background .25s ease;
      flex-shrink: 0;
    }
    /* Simplex (active seul) → bleu, curseur au centre */
    .method-toggle.active .method-track {
      background: #0d6efd;
    }
    /* Deux phases (active + active2) → teal, curseur à droite */
    .method-toggle.active.active2 .method-track {
      background: #0d9488;
    }
    .method-knob {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,.3);
      transition: transform .25s ease;
    }
    .method-toggle.active .method-knob        { transform: translateX(24px); }
    .method-toggle.active.active2 .method-knob { transform: translateX(48px); }
    .method-label {
      font-size: .9rem;
      font-weight: 600;
      color: var(--text);
      min-width: 170px;
      transition: color .2s;
    }
    .method-toggle.active .method-label        { color: #0d6efd; }
    .method-toggle.active.active2 .method-label { color: #0d9488; }
    .method-badge {
      font-size: .72rem;
      vertical-align: middle;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'pb_lineaire:index' %}">OptiLinéaire</a>
    <div class="d-flex align-items-center gap-3">
      <span class="navbar-text" id="navbarMethodText">{% block navbar_method %}{% endblock %}</span>
      <button type="button" class="btn btn-sm btn-outline-light theme-toggle" id="themeToggle" aria-pressed="false">
        Mode sombre
      </button>
    </div>
  </div>
</nav>

<div class="container pb-5">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
/* ── Mode pas à pas ── */
(function () {
  function initStepByStep(section) {
    const cards = Array.from(section.querySelectorAll('.iteration-card'));
    if (cards.length === 0) return;

    const toggleBtn = section.querySelector('.sbs-toggle');
    const nextBtn   = section.querySelector('.sbs-next');
    const allBtn    = section.querySelector('.sbs-all');
    const counter   = section.querySelector('.sbs-counter');
    let shown = 0;

    toggleBtn.addEventListener('click', function () {
      if (toggleBtn.dataset.active === '1') {
        exitMode();
      } else {
        shown = 1;
        cards.forEach(function (c, i) { c.style.display = i < shown ? '' : 'none'; });
        toggleBtn.dataset.active = '1';
        toggleBtn.textContent = 'Quitter le mode pas à pas';
        toggleBtn.classList.replace('btn-outline-primary', 'btn-primary');
        nextBtn.style.display = shown < cards.length ? '' : 'none';
        allBtn.style.display = '';
        updateCounter();
      }
    });

    nextBtn.addEventListener('click', function () {
      if (shown < cards.length) {
        cards[shown].style.display = '';
        cards[shown].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        shown++;
        updateCounter();
        if (shown >= cards.length) nextBtn.style.display = 'none';
      }
    });

    allBtn.addEventListener('click', exitMode);

    function updateCounter() {
      counter.textContent = shown + ' / ' + cards.length;
      counter.style.display = '';
    }

    function exitMode() {
      cards.forEach(function (c) { c.style.display = ''; });
      toggleBtn.dataset.active = '0';
      toggleBtn.textContent = 'Mode pas à pas';
      toggleBtn.classList.replace('btn-primary', 'btn-outline-primary');
      nextBtn.style.display = 'none';
      allBtn.style.display  = 'none';
      counter.style.display = 'none';
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('.iterations-section').forEach(initStepByStep);
  });
})();

/* ── Thème clair / sombre ── */
(function () {
  const storageKey = 'optilineaire-theme';
  const root = document.documentElement;
  const toggle = document.getElementById('themeToggle');

  function systemPrefersDark() {
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  function applyTheme(theme) {
    root.setAttribute('data-theme', theme);
    if (toggle) {
      const isDark = theme === 'dark';
      toggle.textContent = isDark ? 'Mode clair' : 'Mode sombre';
      toggle.setAttribute('aria-pressed', String(isDark));
      toggle.classList.toggle('btn-outline-light', !isDark);
      toggle.classList.toggle('btn-light', isDark);
    }
  }

  const savedTheme = localStorage.getItem(storageKey);
  const initialTheme = savedTheme || (systemPrefersDark() ? 'dark' : 'light');
  applyTheme(initialTheme);

  if (toggle) {
    toggle.addEventListener('click', function () {
      const nextTheme = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      localStorage.setItem(storageKey, nextTheme);
      applyTheme(nextTheme);
    });
  }
})();
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
