<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}OptiLinéaire{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --color-lf:       #e8f4fd;
      --color-entering: #cfe2ff;
      --color-leaving:  #fff3cd;
      --color-pivot:    #dc3545;
    }
    body { background: #f8f9fa; }
    .navbar-brand { font-weight: 700; letter-spacing: 1px; }

    /* Tableaux simplexe */
    .simplex-table { font-size: .9rem; border-collapse: collapse; }
    .simplex-table th, .simplex-table td {
      border: 1px solid #ced4da;
      padding: 6px 12px;
      text-align: center;
      vertical-align: middle;
    }
    .simplex-table th { background: #343a40; color: #fff; }
    .row-lf  td { background: var(--color-lf); font-weight: 600; }
    .col-entering { background: var(--color-entering) !important; }
    .row-leaving  { background: var(--color-leaving) !important; }
    .cell-pivot   {
      background: var(--color-pivot) !important;
      color: #fff !important;
      font-weight: 700;
      border-radius: 3px;
    }
    .label-col { font-weight: 700; background: #495057 !important; color: #fff; }

    /* Légende couleurs */
    .legend-box { width: 20px; height: 20px; display: inline-block; border: 1px solid #aaa; vertical-align: middle; }
    .iteration-card { border-left: 4px solid #0d6efd; }
    .ratio-col { color: #6c757d; font-style: italic; min-width: 80px; }
  </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'pb_lineaire:index' %}">OptiLinéaire</a>
    <span class="navbar-text text-light">Méthode du Simplexe</span>
  </div>
</nav>

<div class="container pb-5">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
