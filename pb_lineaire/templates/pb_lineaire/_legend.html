<!-- Légende des tableaux : chaque repère a une forme, pas seulement une couleur -->
<div class="legend" role="note" aria-label="Légende des tableaux">
  <span class="legend__item"><span class="legend-box legend-box--lf">LF</span> ligne LF (filet épais)</span>
  <span class="legend__item"><span class="legend-box legend-box--entering">▼</span> colonne entrante</span>
  <span class="legend__item"><span class="legend-box legend-box--leaving">◀</span> ligne sortante</span>
  <span class="legend__item"><span class="legend-box legend-box--pivot">p</span> pivot (case inversée)</span>
  {% if show_frac %}<span class="legend__item"><span class="legend-box legend-box--frac">{a}</span> partie fractionnaire</span>{% endif %}
</div>
